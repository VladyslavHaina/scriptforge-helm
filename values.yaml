image:
  repository: vladyslavhaina/scriptforge
  tag: "2.10.0"
  pullPolicy: IfNotPresent

api:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

postgres:
  enabled: true
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  externalUrl: ""

pgbouncer:
  enabled: true
  poolSize: 20
  maxClientConn: 100

ingress:
  enabled: true
  className: nginx
  host: scriptforge.local
  annotations: {}
  tls: []
  certIssuer: ""

runtimeImages:
  bash: "alpine:3.21"
  python: "python:3.13-alpine"
  terraform: "hashicorp/terraform:1.10"
  powershell: "mcr.microsoft.com/powershell:7.5-alpine-3.20"
  ansible: "alpine:3.21"

execution:
  podNamespace: scriptforge-exec
  # Default-deny egress to cloud metadata for execution pods (SF-SANDBOX-03).
  # Only enforced by a NetworkPolicy-capable CNI; harmless no-op otherwise.
  networkPolicy:
    enabled: true
  # Dev-cluster "socket bridge": mount the host Docker socket into the controller so it can
  # build self-service execution-environment images locally (Phase 2). SINGLE-NODE ONLY and a
  # real privilege risk (a pod with the host docker socket ~= root on the host). Keep DISABLED
  # outside local docker-desktop dev; multi-node should use a registry-backed builder instead.
  environmentBuilder:
    dockerSocket: false
    socketPath: /var/run/docker.sock

monitoring:
  enabled: false
  serviceMonitor: false

encryption:
  key: ""

# JWT signing secret — MUST be distinct from encryption.key (SF-AUTH-02).
# Supply on upgrade: --set jwtSecret="$(openssl rand -hex 32)"
jwtSecret: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 20
  cooldownPeriod: 300
  queueThreshold: 10

nameOverride: ""
fullnameOverride: ""
